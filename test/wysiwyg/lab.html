<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WYSIWYG lab — live GeoJSON render vs tilegen tiles</title>
<!-- One layer, three renders of the SAME GeoJSON, pixel-compared in-page:
       tiles        — platform/tilegen.js archive (geojson-vt 4096 extent, DIET), served from memory
       live-default — map.addSource({type:'geojson'}) as the engine does today
       live-aligned — the same, with the source options aligned to tilegen's profile
     Driven headlessly by mapstructor_docs/testing/harness/wysiwyg-gate.mjs. -->
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3/dist/pmtiles.js"></script>
<script src="../../platform/tilegen.js?v=cc50da03"></script>
<style>html,body{margin:0;background:#fff}#map{width:800px;height:600px}#log{font:12px monospace;white-space:pre}</style>
</head>
<body>
<div id="map"></div>
<div id="log"></div>
<script>
(function () {
  var log = function (s) { document.getElementById('log').textContent += s + '\n'; };
  var protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);
  var map = new maplibregl.Map({
    container: 'map', attributionControl: false, interactive: false, fadeDuration: 0,
    preserveDrawingBuffer: true,   // so readPixels sees the last frame
    style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#ffffff' } }] },
    center: [0, 0], zoom: 1
  });
  var PAINT = {
    fill: { 'fill-color': '#1a5fb4', 'fill-opacity': 1, 'fill-outline-color': '#000000' },
    line: { 'line-color': '#000000', 'line-width': 1.5 },
    circle: { 'circle-color': '#1a5fb4', 'circle-radius': 4 }
  };
  // tilegen's profile, in the engine's own units (engine: 512px tile → px×16 = units of 8192;
  // tilegen: 4096 extent → px×8). tilegen: tolerance 3 (poly) / 1 (line) units, buffer 64 units,
  // maxZoom 15 (13 for points).
  var ALIGNED = {
    fill:   { tolerance: 3 / 8,  buffer: 64 / 8, maxzoom: 15 },   // 0.375 px (= the engine default), 8 px, z15
    line:   { tolerance: 1 / 8,  buffer: 64 / 8, maxzoom: 15 },   // 0.125 px
    circle: { tolerance: 3 / 8,  buffer: 64 / 8, maxzoom: 13 }
  };
  window.LAB_ALIGNED = ALIGNED;
  function MemSource(buf) { this.buf = buf; }
  MemSource.prototype.getKey = function () { return 'mem'; };
  MemSource.prototype.getBytes = function (offset, length) { return Promise.resolve({ data: this.buf.buffer.slice(this.buf.byteOffset + offset, this.buf.byteOffset + offset + length) }); };

  function idle() { return new Promise(function (r) { if (map.loaded() && map.areTilesLoaded() && !map.isMoving()) { setTimeout(r, 150); } else map.once('idle', function () { setTimeout(r, 150); }); }); }
  // gl.readPixels on the map's own context read back all-zero under headless swiftshader (10/6:
  // every pixel "ink", every diff 0.00% — a passing gate that measured nothing). toDataURL goes
  // through the compositor's copy of the preserved buffer, and a 2D canvas gives honest bytes.
  function pixels() {
    return new Promise(function (resolve) {
      var c = map.getCanvas(), img = new Image();
      img.onload = function () {
        var c2 = document.createElement('canvas'); c2.width = img.width; c2.height = img.height;
        var ctx = c2.getContext('2d'); ctx.drawImage(img, 0, 0);
        resolve(ctx.getImageData(0, 0, c2.width, c2.height).data);
      };
      img.src = c.toDataURL('image/png');
    });
  }
  function inkOf(px) { var n = px.length / 4, k = 0; for (var i = 0; i < n; i++) { var j = i * 4; if (px[j] < 250 || px[j + 1] < 250 || px[j + 2] < 250) k++; } return k; }
  function clearAll() {
    ['tiles', 'live-default', 'live-aligned'].forEach(function (id) {
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    });
  }
  var state = { fc: null, kind: null, archive: null, srcLayer: null, maxZoom: null };

  window.labLoad = async function (name, kind) {
    var fc = await (await fetch('data/' + name + '.geojson')).json();
    state.fc = fc; state.kind = kind;
    var built = await MSTileGen.buildArchive(fc, { maxZoom: kind === 'circle' ? 13 : 15, name: 'lab', status: log, lineLayer: kind === 'line' });
    state.archive = built.bytes; state.maxZoom = built.maxZoom;
    var p = new pmtiles.PMTiles(new MemSource(built.bytes));
    protocol.add(p);
    var meta = await p.getMetadata();
    state.srcLayer = (meta.vector_layers && meta.vector_layers[0] && meta.vector_layers[0].id) || 'lab';
    return { features: fc.features.length, bytes: built.bytes.length, maxZoom: built.maxZoom, srcLayer: state.srcLayer };
  };
  function show(mode, opts) {
    clearAll();
    var kind = state.kind;
    if (mode === 'tiles') {
      map.addSource('tiles', { type: 'vector', url: 'pmtiles://mem', maxzoom: state.maxZoom });
      map.addLayer({ id: 'tiles', type: kind, source: 'tiles', 'source-layer': state.srcLayer, paint: PAINT[kind] });
    } else {
      var src = { type: 'geojson', data: state.fc };
      if (mode === 'live-aligned') { var a = opts || ALIGNED[kind]; src.tolerance = a.tolerance; src.buffer = a.buffer; src.maxzoom = a.maxzoom; }
      map.addSource(mode, src);
      map.addLayer({ id: mode, type: kind, source: mode, paint: PAINT[kind] });
    }
  }
  // Show ONE mode (or nothing) at a view and settle. The harness then screenshots the map element —
  // in-page reads (gl.readPixels, toDataURL) both came back black under headless GL (10/6), while
  // puppeteer's screenshot is the compositor's real output, which is what the other gates trust.
  window.labShow = async function (mode, center, zoom, alignedOpts) {
    map.jumpTo({ center: center, zoom: zoom });
    if (mode === 'empty') clearAll(); else show(mode, alignedOpts);
    await idle(); await idle();
    var rendered = 0;
    try { rendered = mode === 'empty' ? 0 : map.queryRenderedFeatures({ layers: [mode] }).length; } catch (e) {}
    return { rendered: rendered };
  };
  // Decode screenshots (data URLs) and diff them against the tiles' picture.
  function decode(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { var c2 = document.createElement('canvas'); c2.width = img.width; c2.height = img.height; var ctx = c2.getContext('2d'); ctx.drawImage(img, 0, 0); resolve(ctx.getImageData(0, 0, c2.width, c2.height).data); };
      img.src = url;
    });
  }
  window.labDiff = async function (shots) {   // { empty, tiles, 'live-default', 'live-aligned' }
    var px = {}; for (var k in shots) px[k] = await decode(shots[k]);
    var n = px.tiles.length / 4, dDef = 0, dAl = 0;
    var differs = function (a, b, i) { return Math.abs(a[i] - b[i]) > 16 || Math.abs(a[i + 1] - b[i + 1]) > 16 || Math.abs(a[i + 2] - b[i + 2]) > 16; };
    for (var k2 = 0; k2 < n; k2++) {
      var i4 = k2 * 4;
      if (differs(px.tiles, px['live-default'], i4)) dDef++;
      if (differs(px.tiles, px['live-aligned'], i4)) dAl++;
    }
    // a picture of WHERE tiles and aligned-live disagree: tiles' ink in light grey, disagreements in red,
    // plus the 512px tile grid at this zoom in faint blue — seams vs real geometry drift, by eye
    var W = Math.sqrt(n * 4 / 3) | 0, H = (n / W) | 0, c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
    var ctx = c2.getContext('2d'), out = ctx.createImageData(W, H);
    for (var q = 0; q < n; q++) {
      var j = q * 4, tInk = px.tiles[j] < 250 || px.tiles[j + 1] < 250 || px.tiles[j + 2] < 250, d = differs(px.tiles, px['live-aligned'], j);
      out.data[j] = d ? 220 : (tInk ? 190 : 255); out.data[j + 1] = d ? 30 : (tInk ? 190 : 255); out.data[j + 2] = d ? 30 : (tInk ? 190 : 255); out.data[j + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    try {
      ctx.strokeStyle = 'rgba(40,90,220,0.45)'; ctx.lineWidth = 1;
      var z = Math.floor(map.getZoom()), scale = 512 * Math.pow(2, map.getZoom() - z);   // 512px tiles at integer zoom, scaled by the fractional part
      var tl = map.project(map.unproject([0, 0])), origin = map.project([-180, 85.0511]);
      for (var gx = ((origin.x - tl.x) % scale + scale) % scale; gx < W; gx += scale) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
      for (var gy = ((origin.y - tl.y) % scale + scale) % scale; gy < H; gy += scale) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
    } catch (eG) {}
    return { pixels: n, emptyInk: inkOf(px.empty), ink: inkOf(px.tiles), inkDefault: inkOf(px['live-default']), inkAligned: inkOf(px['live-aligned']), diffDefault: dDef, diffAligned: dAl, diffImage: c2.toDataURL('image/png') };
  };
  window.labReady = new Promise(function (r) { map.on('load', r); });
})();
</script>
</body>
</html>
