<!doctype html>
<html><head><meta charset="utf-8"><title>geoExport lab — GeoPackage written in the browser reads back</title></head>
<body><pre id="log"></pre>
<script src="../../platform/geoExport.js?v=4debd3b6"></script>
<script>
window.labResult = (async () => {
  const out = {};
  try {
    const fc = await (await fetch('../wysiwyg/data/parcels.geojson')).json();
    fc.features.forEach((f, i) => { f.properties.name = 'Parcel ' + (i + 1); f.properties.area = i * 1.5; });
    fc.features.push({ type: 'Feature', properties: { name: 'a point', area: 0 }, geometry: { type: 'Point', coordinates: [-93.68, 41.88] } });
    const t0 = performance.now();
    const bytes = await MSGeoExport.toGeoPackage(fc, 'Parcels 2026');
    out.ms = Math.round(performance.now() - t0); out.bytes = bytes.length;
    out.magic = String.fromCharCode(...bytes.subarray(0, 15));
    // read it back with sql.js itself
    const SQL = await initSqlJs({ locateFile: (f) => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f });
    const db = new SQL.Database(bytes);
    const q = (s) => db.exec(s)[0]?.values || [];
    out.application_id = q('PRAGMA application_id')[0][0];
    out.contents = q('SELECT table_name, data_type, min_x, min_y, max_x, max_y, srs_id FROM gpkg_contents')[0];
    out.geomcol = q('SELECT table_name, column_name, geometry_type_name, srs_id FROM gpkg_geometry_columns')[0];
    const t = out.contents[0];
    out.rows = q(`SELECT count(*), count(geom), min(typeof(geom)), count(DISTINCT name) FROM "${t}"`)[0];
    out.cols = q(`PRAGMA table_info("${t}")`).map((r) => r[1] + ':' + r[2]);
    const g = q(`SELECT geom FROM "${t}" LIMIT 1`)[0][0];
    out.firstGeomHead = Array.from(g.subarray(0, 8));   // 'G','P',0,flags, srs_id LE int32
    out.firstWkbType = g[8 + 32 + 1] | (g[8 + 32 + 2] << 8);   // after 8-byte header + 32-byte XY envelope: byte order, then uint32 type
    db.close();
  } catch (e) { out.fatal = String(e.message || e).slice(0, 300); }
  document.getElementById('log').textContent = JSON.stringify(out, null, 1);
  return out;
})();
</script></body></html>
