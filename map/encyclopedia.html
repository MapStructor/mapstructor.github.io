<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource — MapStructor</title>
  <link rel="icon" href="../images/logo-transparent.png">
  <style>
    /* A map's encyclopedia: every entry of every content type, grouped the way the type's first
       coloured enum field groups them (the home-protection map: by category), A–Z inside, with a
       filter box. Built with textContent — the titles are the map owner's. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --p: #7c5cbf; --p-dark: #6246a8; }
    body { font-family: 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif; background: #f0eaff; color: #1e1b2e; min-height: 100vh; }
    nav { position: fixed; top: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 16px clamp(16px, 4vw, 40px); z-index: 20; }
    /* the same button the map header wears (engine .header-btn) — owner 10/27: "Make the map button here the
       same type of button we have on the map headers" */
    nav a { display: inline-block; color: #000; text-align: center; padding: 10px; text-decoration: none; font-size: 15px; line-height: 25px; border-radius: 4px; border: solid #000; font-weight: bold; font-family: Arial, sans-serif; background: rgba(255,255,255,0.95); white-space: nowrap; }
    nav a:hover { background: #f3effd; }
    main { max-width: 960px; margin: 0 auto; padding: clamp(64px, 9vw, 96px) clamp(16px, 4vw, 40px) 60px; }
    .crumb { color: #9490a8; font-size: 13px; text-decoration: none; }
    h1 { margin-top: 8px; font-size: clamp(26px, 4.5vw, 38px); font-weight: 800; letter-spacing: -0.02em; }
    .sub { margin-top: 6px; color: #6e6585; font-size: 15px; }
    .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 6px; }
    .tools input { flex: 1 1 260px; max-width: 420px; padding: 10px 12px; border: 1px solid rgba(124,92,191,0.3); border-radius: 8px; font-size: 15px; }
    .tools .n { color: #6e6585; font-size: 13px; }
    .type { margin-top: 22px; }
    .type > h2 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #9490a8; margin-bottom: 8px; }
    .group { background: #fff; border: 1px solid rgba(124,92,191,0.18); border-left-width: 6px; border-radius: 12px; padding: 14px 18px; margin-top: 10px; }
    .group h3 { font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .group h3 .cnt { font-size: 12px; color: #6e6585; font-weight: 600; }
    .list { columns: 2; column-gap: 28px; margin-top: 8px; }
    @media (max-width: 640px) { .list { columns: 1; } }
    .list a { display: block; break-inside: avoid; padding: 5px 0; color: #2b2540; text-decoration: none; font-size: 15px; border-bottom: 1px solid #f0edf7; }
    .list a:hover { color: var(--p); }
    .list a small { color: #9490a8; margin-left: 6px; font-size: 12px; }
    .hide { display: none; }
    .empty { color: #6e6585; padding: 30px 0; }
    footer { display: flex; justify-content: center; gap: 18px; padding: 24px; }
    footer a { color: #9490a8; text-decoration: none; font-size: 12.5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../platform/auth.js?v=c3e839f1"></script>
  <script src="../platform/content.js?v=0a9f8f2f"></script>
</head>
<body>
  <nav>
    <a id="nav-map" href="#">Map</a>
  </nav>
  <main>
    <a class="crumb" id="crumb" href="#">Map</a>
    <h1 id="title">Resource</h1>
    <p class="sub" id="sub">Every entry on this map.</p>
    <div class="tools"><input id="q" type="search" placeholder="Filter by name…" autocomplete="off"><span class="n" id="n"></span></div>
    <div id="body"><p class="empty">Loading…</p></div>
  </main>
  <footer><a href="../index.html">MapStructor</a></footer>
  <script>
    (async function () {
      // a standalone copy (download / showcase) carries the content as window.__msContent
      // (project/contentData.js) and names its map there — no id in the address, no database
      var st = window.__msContent || null;
      var q = new URLSearchParams(location.search), pid = (q.get('id') || (st && st.map && st.map.id) || '').trim();
      var body = document.getElementById('body');
      if (!pid) { body.innerHTML = '<p class="empty">This page needs a map id.</p>'; return; }
      var mapUrl = st ? (window.__msMapUrl || 'index.html') : 'index.html?id=' + encodeURIComponent(pid);   // a copy's resource/ pages name the map one folder over
      document.getElementById('nav-map').href = mapUrl; document.getElementById('crumb').href = mapUrl;
      var proj = await MSContent.project(pid);
      var mapName = (proj && proj.name) || 'Map';
      document.getElementById('crumb').textContent = mapName;
      // the page is named after its map (owner 10/27): "Personal Home Protection Rights: Resource"
      var resName = await MSContent.resourceName(pid);   // "Resource", "Encyclopedia", … — the map's own word for these pages
      document.title = mapName + ': ' + resName;
      document.getElementById('title').textContent = mapName + ': ' + resName;
      // the owner's vetting notice (10/27): "Help Us Vet!" + About at the top, above the title
      MSContent.css();
      var vet = await MSContent.vetting(pid);
      var bar = MSContent.topBar(vet);
      if (bar) { var tb = document.createElement('div'); tb.innerHTML = bar; var h1 = document.getElementById('title'); while (tb.firstChild) h1.parentNode.insertBefore(tb.firstChild, h1); }
      var types = await MSContent.types(pid);
      if (!types.length) { body.innerHTML = '<p class="empty">This map has no encyclopedia yet.</p>'; return; }
      body.innerHTML = '';
      var total = 0, all = [];
      for (var ti = 0; ti < types.length; ti++) {
        var t = types[ti];
        var entries = (await MSContent.entriesForType(t.id)).slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
        if (!entries.length) continue;
        total += entries.length;
        var sec = document.createElement('section'); sec.className = 'type';
        var h2 = document.createElement('h2'); h2.textContent = (t.name_plural || t.name) + ' · ' + entries.length; sec.appendChild(h2);
        // group by the first coloured enum field shown on the page, else one A–Z group
        var gf = (t.fields || []).filter(function (f) { return f.kind === 'enum' && f.colors; })[0] || null;
        var groups = [];
        if (gf) {
          (gf.options || []).forEach(function (o) { groups.push({ v: o, label: MSContent.enumLabel(gf, o), color: MSContent.enumColor(gf, o), items: [] }); });
          var other = { v: null, label: 'Other', color: null, items: [] };
          entries.forEach(function (e) { var v = e.body && e.body[gf.key]; var g = groups.filter(function (x) { return String(x.v) === String(v); })[0]; (g || other).items.push(e); });
          if (other.items.length) groups.push(other);
          groups = groups.filter(function (g) { return g.items.length; });
        } else groups.push({ v: null, label: 'A – Z', color: null, items: entries });
        groups.forEach(function (g) {
          var div = document.createElement('div'); div.className = 'group'; if (g.color) div.style.borderLeftColor = g.color;
          var h3 = document.createElement('h3'); h3.textContent = g.label; var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = g.items.length; h3.appendChild(cnt); div.appendChild(h3);
          var list = document.createElement('div'); list.className = 'list';
          g.items.forEach(function (e) {
            var a = document.createElement('a'); a.href = MSContent.entryUrl(pid, e.slug); a.textContent = e.title; a.setAttribute('data-t', e.title.toLowerCase());
            if (e.key) { var s = document.createElement('small'); s.textContent = e.key; a.appendChild(s); }
            list.appendChild(a); all.push(a);
          });
          div.appendChild(list); sec.appendChild(div);
        });
        body.appendChild(sec);
      }
      document.getElementById('sub').textContent = total + ' entries on this map.';
      var n = document.getElementById('n');
      document.getElementById('q').addEventListener('input', function () {
        var v = this.value.trim().toLowerCase(), shown = 0;
        all.forEach(function (a) { var hit = !v || a.getAttribute('data-t').indexOf(v) > -1; a.classList.toggle('hide', !hit); if (hit) shown++; });
        document.querySelectorAll('.group').forEach(function (g) { g.classList.toggle('hide', !g.querySelector('.list a:not(.hide)')); });
        n.textContent = v ? shown + ' match' + (shown === 1 ? '' : 'es') : '';
      });
    })();
  </script>
</body>
</html>
