<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Portal — MapStructor</title>
  <link rel="icon" href="images/logo-transparent.png">
  <style>
    /* Map Portal (component 1, plan step 2b) — one card for now; the grid grows as maps join. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --p: #7c5cbf; --p-dark: #6246a8; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0eaff; color: #1e1b2e; min-height: 100vh; }
    nav { position: fixed; top: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 16px clamp(16px, 4vw, 40px); z-index: 20; }
    nav a { color: #6e6585; text-decoration: none; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 6px; white-space: nowrap; }

    .head { text-align: center; padding: clamp(56px, 9vw, 96px) 20px clamp(28px, 4vw, 44px); }
    .head h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 800; letter-spacing: -0.03em; }
    .head p { margin-top: 10px; color: #9490a8; font-size: clamp(14px, 1.8vw, 17px); }

    main { max-width: 1100px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px) clamp(56px, 8vw, 88px); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

    .card { background: #fff; border: 1px solid rgba(124,92,191,0.18); border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 10px rgba(30,27,46,0.06); transition: transform .12s, box-shadow .12s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(30,27,46,0.10); }
    .thumb { display: block; width: 100%; height: 180px; object-fit: cover; background: linear-gradient(120deg, #d9cff1, #b9d8c9); }
    .card-body { padding: 16px 18px 18px; }
    .card-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-title .star { font-size: 19px; text-decoration: none; line-height: 1; }
    .card-blurb { margin-top: 8px; color: #6e6585; font-size: 13.5px; line-height: 1.5; }
    .card-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .btn { display: inline-block; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 20px; border-radius: 7px; }
    .btn-view { background: #1e1b2e; color: #fff; }
    .btn-view:hover { background: #2e2848; }
    .hint { color: #9490a8; font-size: 12.5px; }

    .coming { margin-top: 36px; text-align: center; color: #9490a8; font-size: 13.5px; }
    .btn-contrib { display: inline-block; margin-top: 18px; text-decoration: none; font-weight: 700; font-size: 14px;
                   padding: 10px 22px; border-radius: 8px; background: var(--p); color: #fff; }
    .btn-contrib:hover { background: var(--p-dark); }
    .contrib-hint { margin-top: 8px; color: #9490a8; font-size: 12.5px; }
    footer { display: flex; justify-content: center; gap: 18px; padding: 24px; }
    footer a { color: #9490a8; text-decoration: none; font-size: 12.5px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="platform/auth.js?v=20260728a"></script>
  <script src="platform/veil.js?v=20260731a"></script>
  <script src="platform/topbar.js?v=20260728a"></script>
  <script src="platform/bookmarks.js?v=20260806a"></script>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="#" class="btn-nav" id="nav-auth" style="display:none;">Login</a>
  </nav>

  <div class="head">
    <h1>Map Portal</h1>
    <p>Curated maps and datasets to explore — and to add straight into your own maps.</p>
    <a class="btn-contrib" href="#" id="btn-contrib" title="Start a new map to contribute">＋ Contribute a map</a>
    <div class="contrib-hint">Starts a fresh map — build it, then <b>Share</b> → <b>Add to Portal</b>. Already have one? <a href="dashboard.html" style="color:inherit;">Open it from your maps</a>.</div>
  </div>

  <main>
    <!-- cards come from portal_entries (joined to projects for the live name); maps that turned
         private or were deleted drop out of the join automatically -->
    <div class="grid" id="portal-grid"></div>
    <div class="coming" id="portal-note">Loading…</div>
  </main>

  <footer>
    <a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="report.html">Report a map</a>
  </footer>

  <script>
    (function () {
      // blurbs and names are USER text — cards are built with textContent, never innerHTML,
      // and thumbs must look like an image (data:image/, images/, or http(s) URL) to render
      var THUMB_OK = /^(data:image\/|images\/|https?:\/\/)/;
      function card(e) {
        var name = (e.projects && e.projects.name) || 'Untitled Map';
        var c = document.createElement('div'); c.className = 'card';
        var t;
        if (e.thumb && THUMB_OK.test(e.thumb)) {
          t = document.createElement('img'); t.className = 'thumb'; t.alt = '';
          t.src = e.thumb; t.onerror = function () { this.removeAttribute('src'); };
        } else { t = document.createElement('div'); t.className = 'thumb'; }
        c.appendChild(t);
        var body = document.createElement('div'); body.className = 'card-body';
        var title = document.createElement('div'); title.className = 'card-title';
        var nm = document.createElement('span'); nm.textContent = name; title.appendChild(nm);
        var star = document.createElement('a'); star.className = 'star'; star.href = '#'; star.textContent = '☆'; title.appendChild(star);
        body.appendChild(title);
        var bl = document.createElement('div'); bl.className = 'card-blurb'; bl.textContent = e.blurb || ''; body.appendChild(bl);
        var act = document.createElement('div'); act.className = 'card-actions';
        var v = document.createElement('a'); v.className = 'btn btn-view'; v.href = 'map/index.html?id=' + encodeURIComponent(e.project_id); v.textContent = 'View'; act.appendChild(v);
        var h = document.createElement('span'); h.className = 'hint'; h.textContent = '★ saves it to your Portal Bookmarks'; act.appendChild(h);
        body.appendChild(act); c.appendChild(body);
        (function wireStar() { if (window.MSBookmarks) MSBookmarks.star(star, e.project_id); else setTimeout(wireStar, 150); })();
        return c;
      }
      async function load() {
        if (!(window.MapAuth && MapAuth.db)) return setTimeout(load, 150);
        var grid = document.getElementById('portal-grid'), note = document.getElementById('portal-note');
        try {
          var r = await MapAuth.db.from('portal_entries')
            .select('project_id, blurb, thumb, sort_order, created_at, projects!inner(name, is_public, deleted_at)')
            .eq('projects.is_public', true).is('projects.deleted_at', null)
            .order('sort_order', { ascending: true }).order('created_at', { ascending: false });
          if (r.error) throw new Error(r.error.message);
          (r.data || []).forEach(function (e) { grid.appendChild(card(e)); });
          note.textContent = (r.data && r.data.length)
            ? 'More maps appear here as their makers contribute them.'
            : 'No maps yet — open your map → Share → Add to Portal to be the first.';
        } catch (e) {
          note.textContent = 'The portal list could not load — please try again in a moment.';
        }
      }
      load();

      // "Contribute a map" starts a FRESH map, exactly like the front page's Create a Map
      // (owner request 8/6) — same insert, same anonymous-signin fallback, same landing.
      var cb = document.getElementById('btn-contrib');
      if (cb) cb.addEventListener('click', async function (ev) {
        ev.preventDefault();
        if (!(window.MapAuth && MapAuth.db)) return;
        var db = MapAuth.db, label = cb.textContent;
        cb.textContent = 'Creating…'; cb.style.pointerEvents = 'none';
        try {
          var u = await MapAuth.currentUser();
          if (!u) { var a = await db.auth.signInAnonymously(); if (a.error) throw new Error(a.error.message); u = a.data && a.data.user; }
          var r = await db.from('projects')
            .insert({ name: 'Untitled Map', user_id: u && u.id, is_public: false, raw_config: { visibility: 'private' } })
            .select('id').single();
          if (r.error || !r.data) throw new Error((r.error && r.error.message) || 'could not create the map');
          window.location.href = 'map/editor.html?id=' + r.data.id;
        } catch (e) {
          cb.textContent = label; cb.style.pointerEvents = '';
          document.getElementById('portal-note').textContent = 'Could not start a new map: ' + ((e && e.message) || e);
        }
      });
    })();
  </script>
</body>
</html>
