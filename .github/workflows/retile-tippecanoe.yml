# Remote tiler + FOLD engine: real tippecanoe on a free GitHub runner (The Fold C2, 7/29).
# The browser tiler (platform/tilegen.js) remains the instant default. Run manually
# (Actions tab → Run workflow), via the Worker's POST /fold (imports), or the API:
#   POST /repos/MapStructor/mapstructor.github.io/actions/workflows/retile-tippecanoe.yml/dispatches
#     {"ref":"master","inputs":{"project_id":"…","layer_id":"…","mode":"fold-raw","raw_key":"tiles/…/….source.geojson"}}
#
# Modes (scripts/retile-tippecanoe.mjs): retile (default — tiles only, now dual-written
# to R2 with label + dirty-tracking stamps) · fold-rows (rows → full artifact set,
# stamps folded; rows NOT deleted — C6 soft-first) · fold-raw (import reroute: reads the
# client-uploaded FC from R2, mints ids, inserts ZERO Postgres rows).
#
# ONE-TIME SETUP: repo secrets SUPABASE_SERVICE_KEY (same as storage-alert.yml) and, for
# fold modes, R2_ACCOUNT_ID + a key pair that can write the mapstructor-tiles bucket —
# R2_TILES_ACCESS_KEY_ID/R2_TILES_SECRET_ACCESS_KEY if the backup pair (R2_ACCESS_KEY_ID/
# R2_SECRET_ACCESS_KEY, used by backup.yml) is scoped to the backups bucket only.

name: Retile with tippecanoe

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id (uuid)"
        required: true
      layer_id:
        description: "Layer id (uuid)"
        required: true
      max_zoom:
        description: "Max zoom (empty = tippecanoe decides via -zg)"
        required: false
        default: ""
      simplification:
        description: "tippecanoe --simplification multiplier (empty = default; heavy layers use 6)"
        required: false
        default: ""
      mode:
        description: "retile | fold-rows | fold-raw"
        required: false
        default: "retile"
      raw_key:
        description: "R2 key of the source FeatureCollection (fold-raw only)"
        required: false
        default: ""

# two dispatches for the same layer would race on the same storage keys + layer row
concurrency:
  group: retile-${{ github.event.inputs.layer_id }}
  cancel-in-progress: false

jobs:
  retile:
    runs-on: ubuntu-latest
    # 30 minutes fit tiles-only retiles; a FOLD of survey-resolution geometry legitimately needs
    # longer (8/15: rows read in 106s, then tippecanoe was killed mid-bake at the cap). Runner
    # minutes are free on a public repo, so the cap should catch a hang, not honest work.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build tippecanoe (felt fork)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Install duckdb (fold parquet artifacts)
        if: ${{ inputs.mode != 'retile' && inputs.mode != '' }}   # every fold mode bakes parquets
        run: pip install --quiet duckdb

      - name: Fetch, tile, bake artifacts, upload, stamp
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
          LAYER_ID: ${{ inputs.layer_id }}
          MAX_ZOOM: ${{ inputs.max_zoom }}
          MODE: ${{ inputs.mode }}
          SIMPLIFY: ${{ inputs.simplification }}
          RAW_KEY: ${{ inputs.raw_key }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TILES_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TILES_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/retile-tippecanoe.mjs
