# Platform storage alert (7/15): daily check of total MapStructor data vs the Supabase FREE plan
# (Pro: 8 GB database). At ≥30% it opens (or updates) a GitHub issue — GitHub then EMAILS the repo
# owner natively, no mail provider needed. The on-site twin is the admin modal in platform/auth.js.
#
# ONE-TIME SETUP: repo → Settings → Secrets and variables → Actions → New repository secret
#   name:  SUPABASE_SERVICE_KEY
#   value: the service-role key (secrets/supabase.md — never commit it)
name: storage-alert
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC (~8am US Central)
  workflow_dispatch: {}     # manual test run

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Map-load meter — warn at the owner's alert line
        # Mapbox bills per map load and exposes no API to read the count, so the platform keeps
        # its own tally (guard.js → ms_map_load). This is the part that means you don't have to
        # visit a dashboard to find out: at the alert line you get an issue, and GitHub emails it.
        # The FREEZE is automatic and lives in the database — this step only warns.
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "no service key — skipping"; exit 0; fi
          JSON=$(curl -s -X POST "https://eqpxlwbjqiwfjlsuapvu.supabase.co/rest/v1/rpc/ms_service_state"             -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "$JSON"
          LOADS=$(echo "$JSON" | grep -o '"map_loads":[0-9]*' | grep -o '[0-9]*' | head -1)
          ALERT=$(echo "$JSON" | grep -o '"map_load_alert":[0-9]*' | grep -o '[0-9]*' | head -1)
          CAP=$(echo "$JSON"   | grep -o '"map_load_cap":[0-9]*'   | grep -o '[0-9]*' | head -1)
          FROZEN=$(echo "$JSON" | grep -o '"frozen":[a-z]*' | cut -d: -f2 | head -1)
          case "$LOADS" in ''|*[!0-9]*) echo "guard not installed yet — skipping"; exit 0;; esac
          echo "map loads this month: $LOADS (alert $ALERT, freeze $CAP, frozen=$FROZEN)"
          echo "- Map loads this month: **$LOADS** / freeze at $CAP" >> "$GITHUB_STEP_SUMMARY"
          [ "$LOADS" -lt "$ALERT" ] && { echo "under the alert line"; exit 0; }
          PCT=$((LOADS * 100 / CAP))
          TITLE="⚠ Map loads at $LOADS this month (${PCT}% of the freeze line)"
          BODY="**$LOADS map loads** so far this month. Your alert line is $ALERT; maps freeze automatically at **$CAP** (Mapbox's free tier is 50,000/month).

          Frozen right now: **$FROZEN**

          This is the meter the MapLibre migration retires — until then, the freeze is what keeps it
          from becoming a bill. Adjust the lines with \`select public.ms_service_set_map_caps(cap, alert);\`

          (Automated daily check: .github/workflows/storage-alert.yml)"
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search "Map loads at in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue edit "$EXISTING" --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Check storage and alert
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "SUPABASE_SERVICE_KEY secret not set — skipping"; exit 0; fi
          BYTES=$(curl -s -X POST "https://eqpxlwbjqiwfjlsuapvu.supabase.co/rest/v1/rpc/mapstructor_total_storage" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "total bytes: $BYTES"
          case "$BYTES" in ''|*[!0-9]*) echo "RPC did not return a number — skipping"; exit 0;; esac
          LIMIT=$((8 * 1024 * 1024 * 1024))
          PCT=$((BYTES * 100 / LIMIT))
          echo "usage: ${PCT}% of the Supabase Pro plan (8 GB)"
          if [ "$PCT" -lt 50 ]; then echo "below 50% — all good"; exit 0; fi
          MB=$((BYTES / 1024 / 1024))
          TITLE="⚠ Platform storage at ${PCT}% of the Supabase Pro plan (8 GB)"
          BODY="MapStructor total data: **${MB} MB / 8192 MB** (${PCT}%). Plan the infra upgrade before it fills — imports and edits stop for everyone at 100%. (Automated daily check: .github/workflows/storage-alert.yml)"
          # one open alert issue at a time — update its title/body as the % climbs, reopen if closed while still over
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search "Platform storage at in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi

      # Item 3: the OTHER alert lines (MAU, runaway edit volume, daily growth) from
      # mapstructor_alerts() — sql/setup/instrumentation.sql. db_size is excluded here
      # (the step above owns it). Silence = no issue = no email.
      - name: Check instrumentation alert lines
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "SUPABASE_SERVICE_KEY secret not set — skipping"; exit 0; fi
          ALERTS=$(curl -s -X POST "https://eqpxlwbjqiwfjlsuapvu.supabase.co/rest/v1/rpc/mapstructor_alerts" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "alerts: $ALERTS"
          echo "$ALERTS" | jq -e 'type == "array"' >/dev/null 2>&1 || { echo "rpc missing or invalid — run instrumentation.sql"; exit 0; }
          OTHERS=$(echo "$ALERTS" | jq '[.[] | select(.line != "db_size")]')
          N=$(echo "$OTHERS" | jq 'length')
          if [ "$N" -eq 0 ]; then echo "no other lines crossed — all quiet"; exit 0; fi
          BODY=$(echo "$OTHERS" | jq -r '.[] | "- **" + .line + "** — " + .msg')
          BODY="$BODY

          (Automated daily check: .github/workflows/storage-alert.yml → mapstructor_alerts())"
          TITLE="⚠ Platform alert: ${N} line(s) crossed (instrumentation)"
          EXISTING=$(gh issue list --repo "$GH_REPO" --state open --search "Platform alert: in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$BODY"
          fi
