# R2 usage watcher (7/31) — the only meter the platform cannot see from the inside.
#
# Tiles are served straight from the R2 custom domain to the browser. They never pass through the
# Worker, the database, or any of our code, so nothing inside MapStructor can count them. The only
# place that number exists is Cloudflare's own analytics — so this job fetches it and parks it in
# ms_service_guard, where the ceilings in sql/setup/service-guard-v3.sql can act on it.
#
# The work is in scripts/r2-usage.mjs, deliberately: the first version was a shell step and it died
# in 0.24 seconds with no output, which cannot be debugged without a push each time. Node runs the
# same here and on my machine, so it can be proven before it ships.
#
# ONE-TIME SETUP — three repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   your account id (Cloudflare → R2 → right-hand sidebar)
#   CLOUDFLARE_API_TOKEN    a READ-ONLY token: My Profile → API Tokens → Create Token →
#                           Custom token → Permissions: Account · Account Analytics · Read
#   SUPABASE_SERVICE_KEY    already set (shared with the other watchers)
# Without them the script logs and exits 0, so this is safe to merge before the secrets exist.
name: r2-usage

on:
  schedule:
    - cron: "20 13 * * *"    # daily, just after the storage alert
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read R2 operations from Cloudflare, record them, alert if high
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/r2-usage.mjs
