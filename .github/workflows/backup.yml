# Nightly off-provider backups — closes the "Supabase holds the only copy" gap
# (architecture doc, build step ①). Inert until the repo secrets below exist:
# each stage checks its secrets and skips gracefully, so committing this is safe.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL       — Supavisor SESSION pooler URI (IPv4, port 5432), from
#                           Supabase dashboard → Connect → Session pooler. The
#                           direct db host is IPv6-only and unreachable from runners.
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — R2 S3 token; must be
#                           scoped to include the PRIVATE mapstructor-db-backups bucket
#                           (dumps moved there 7/27 — the tiles bucket gained a public
#                           custom domain, so backups can NEVER live in it).
#   B2_KEY_ID / B2_APP_KEY — Backblaze B2 application key.
#
# What is (and isn't) backed up:
#   pg_dump of Postgres  → R2 backups/db/  → mirrored to B2.   THE vital copy.
#   Tiles/sidecars/rasters are NOT dumped — they're disposable projections that
#   regenerate from Postgres (and later from GeoParquet, which will live on R2
#   and be covered by the R2→B2 mirror automatically).
# Retention: 14 daily dumps; older ones pruned after a successful new dump.

name: nightly-backup
on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC daily
  workflow_dispatch: {}

permissions:
  issues: write        # the free-tier watcher opens an issue when B2 nears its ceiling
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: gate
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          R2KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          B2KEY: ${{ secrets.B2_KEY_ID }}
        run: |
          echo "db=$([ -n "$DBURL" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "r2=$([ -n "$R2KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "b2=$([ -n "$B2KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ -z "$DBURL" ] && echo "::notice::SUPABASE_DB_URL not set — backup skipped (scaffold mode)" || true

      - name: Install postgres client 17
        if: steps.gate.outputs.db == 'yes'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        if: steps.gate.outputs.db == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # the runner preinstalls postgres client 16 and its wrapper wins the PATH —
          # server is 17.x and pg_dump refuses on version mismatch. Use 17 explicitly.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          STAMP=$(date -u +%Y%m%d)
          # public schema only — a full-DB dump fails on Supabase (auth/storage/realtime
          # tables are owned by supabase_*_admin roles → permission denied, exit 1).
          # All app data lives in public; auth.users (needed to remap ownership on a
          # restore) is exported separately below — postgres CAN select it (verified).
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f "db-$STAMP.dump"
          psql "$SUPABASE_DB_URL" -c "\copy (select id, email, is_anonymous, created_at, last_sign_in_at from auth.users) to 'auth-users-$STAMP.csv' csv header" || echo "::warning::auth.users export failed (non-fatal)"
          ls -lh db-*.dump auth-users-*.csv || true
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload dump to R2 + prune old
        if: steps.gate.outputs.db == 'yes' && steps.gate.outputs.r2 == 'yes'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # bucket-scoped R2 tokens can't list/create buckets — without this rclone's
          # pre-upload bucket check 403s (AccessDenied) even though object PUTs work
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          # NOT apt: `apt-get install rclone` with no `apt-get update` first fails the moment the
          # runner image's package index goes stale — the .deb it asks for 404s. That is exactly
          # what broke the restore drill on 7/29 and again on 7/31. The static binary has no index.
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
            unzip -qq -o /tmp/rclone.zip -d /tmp/rclone-dl
            sudo install -m 755 /tmp/rclone-dl/*/rclone /usr/local/bin/rclone
          fi
          rclone version | head -1
          rclone copyto "db-$STAMP.dump" "r2:mapstructor-db-backups/db/db-$STAMP.dump"
          [ -f "auth-users-$STAMP.csv" ] && rclone copyto "auth-users-$STAMP.csv" "r2:mapstructor-db-backups/db/auth-users-$STAMP.csv"
          rclone delete --min-age 14d "r2:mapstructor-db-backups/db/"
          rclone ls "r2:mapstructor-db-backups/db/"

      - name: Mirror R2 backups to Backblaze B2
        if: steps.gate.outputs.db == 'yes' && steps.gate.outputs.r2 == 'yes' && steps.gate.outputs.b2 == 'yes'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          rclone sync "r2:mapstructor-db-backups/" "b2:mapstructor-backups/backups/"
          rclone ls "b2:mapstructor-backups/backups/" | head -20

      - name: Watch the free-tier ceilings (B2 + R2 backups)
        # Backblaze will not let you set a spend cap without a credit card on file — and with NO
        # card it cannot charge you at all, so the deliberate choice is: no card, and watch the
        # numbers instead. B2's free tier is 10 GB stored and 1 GB/day downloaded. If the backups
        # ever approach that, the failure mode without this warning is silent: B2 starts refusing
        # writes and the nightly backup quietly stops being a backup.
        if: steps.gate.outputs.b2 == 'yes'
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BYTES=$(rclone size "b2:mapstructor-backups/" --json 2>/dev/null | grep -o '"bytes":[0-9]*' | grep -o '[0-9]*' || echo 0)
          FREE=$((10 * 1024 * 1024 * 1024))
          PCT=$((BYTES * 100 / FREE))
          echo "B2 backups: $((BYTES / 1024 / 1024)) MB — ${PCT}% of the 10 GB free tier"
          echo "- B2 backups: **$((BYTES / 1024 / 1024)) MB** (${PCT}% of the 10 GB free tier)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -ge 70 ]; then
            TITLE="⚠ Backups approaching the Backblaze free tier (${PCT}%)"
            BODY="B2 holds **$((BYTES / 1024 / 1024)) MB**, which is ${PCT}% of the 10 GB free tier.

          Past 100% B2 starts refusing writes — the backup would keep 'succeeding' while storing
          nothing. Options, cheapest first: shorten the 14-day retention, prune old dumps, or accept
          a small B2 bill (which needs a card on file, and a card is also what unlocks their caps).

          (Automated check: .github/workflows/backup.yml)"
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Backups approaching in:title" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY";
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          fi

      - name: Fallback — dump straight to B2 if R2 isn't set up yet
        if: steps.gate.outputs.db == 'yes' && steps.gate.outputs.r2 == 'no' && steps.gate.outputs.b2 == 'yes'
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          # NOT apt: `apt-get install rclone` with no `apt-get update` first fails the moment the
          # runner image's package index goes stale — the .deb it asks for 404s. That is exactly
          # what broke the restore drill on 7/29 and again on 7/31. The static binary has no index.
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
            unzip -qq -o /tmp/rclone.zip -d /tmp/rclone-dl
            sudo install -m 755 /tmp/rclone-dl/*/rclone /usr/local/bin/rclone
          fi
          rclone version | head -1
          rclone copyto "db-$STAMP.dump" "b2:mapstructor-backups/backups/db/db-$STAMP.dump"
          rclone delete --min-age 14d "b2:mapstructor-backups/backups/db/"
