# RESTORE DRILL (launch-path #2) — "an untested backup isn't a backup."
# Pulls the NEWEST nightly dump from R2 (B2 fallback) and restores it into a
# disposable PostGIS container inside the runner, then asserts the data is real:
# table count, row-count floors on the core tables, and a live PostGIS geometry
# query. Touches NOTHING outside the runner. Fails loud: opens a GitHub issue
# (repo watchers get the email) exactly like storage-alert.yml.
#
# Uses the SAME secrets nightly-backup already has: R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (and B2_KEY_ID/B2_APP_KEY for fallback).
# Runs monthly + on demand (Actions → restore-drill → Run workflow).

name: restore-drill
on:
  schedule:
    - cron: "47 8 1 * *"   # 08:47 UTC on the 1st — after that morning's backup
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5   # plain postgres:17 lacks PostGIS — the dump needs it
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check secrets
        id: gate
        env:
          R2KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          echo "r2=$([ -n "$R2KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ -z "$R2KEY" ] && echo "::warning::R2 secrets not set — drill skipped" || true

      - name: Fetch newest dump from R2 (B2 fallback)
        if: steps.gate.outputs.r2 == 'yes'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          # NOT apt: `apt-get install rclone` with no `apt-get update` first fails the moment the
          # runner image's package index goes stale — the .deb it asks for 404s. That is precisely
          # why this drill "failed" on 7/29 and 7/31; the backups themselves were never the problem.
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
            unzip -qq -o /tmp/rclone.zip -d /tmp/rclone-dl
            sudo install -m 755 /tmp/rclone-dl/*/rclone /usr/local/bin/rclone
          fi
          rclone version | head -1
          NEWEST=$(rclone lsf "r2:mapstructor-db-backups/db/" --include "db-*.dump" | sort | tail -1)
          if [ -z "$NEWEST" ] && [ -n "${{ secrets.B2_KEY_ID }}" ]; then
            echo "::warning::R2 empty — falling back to B2"
            NEWEST=$(rclone lsf "b2:mapstructor-backups/backups/db/" --include "db-*.dump" | sort | tail -1)
            rclone copyto "b2:mapstructor-backups/backups/db/$NEWEST" "restore.dump"
          else
            rclone copyto "r2:mapstructor-db-backups/db/$NEWEST" "restore.dump"
          fi
          [ -s restore.dump ] || { echo "::error::no dump fetched"; exit 1; }
          # freshness: the newest dump must be from the last 3 days (else backups are silently dead)
          STAMP=$(echo "$NEWEST" | grep -oE '[0-9]{8}')
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$STAMP" +%s) ) / 86400 ))
          echo "newest dump: $NEWEST (${AGE_DAYS}d old, $(du -h restore.dump | cut -f1))"
          [ "$AGE_DAYS" -le 3 ] || { echo "::error::newest dump is ${AGE_DAYS} days old — nightly backup is broken"; exit 1; }

      - name: Restore into the disposable container
        if: steps.gate.outputs.r2 == 'yes'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          export PGPASSWORD=drill
          # The dump is PUBLIC-SCHEMA-ONLY from Supabase — it references cluster-level things a
          # bare Postgres lacks: the anon/authenticated/service_role ROLES (RLS policies name
          # them), the auth SCHEMA, auth.uid() (policy expressions), and auth.users (FKs).
          # Scaffold those first or CREATE TABLE/POLICY statements cascade-fail (run #1: 14 errors).
          psql -h localhost -U postgres -d drill -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon')          THEN CREATE ROLE anon NOLOGIN;          END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role')  THEN CREATE ROLE service_role NOLOGIN;  END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, is_anonymous boolean, created_at timestamptz, last_sign_in_at timestamptz);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'select null::uuid';
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$select 'anon'::text$$;
          SQL
          # TWO PASSES, and the reason matters. The dump is public-schema-only, so it carries the
          # rows that REFERENCE accounts but not the accounts themselves. Restored in one pass, the
          # foreign keys (projects.user_id → auth.users.id, layers.user_id → …) are created against
          # an empty auth.users and every one of them fails. That is what "the restore drill is
          # broken" was: not lost data, a missing referenced table.
          #
          # So: structure + rows first, then seed auth.users from the ids the data actually points
          # at, then let the constraints be created. The FKs are therefore genuinely PROVEN — a
          # constraint that is created and satisfied is real evidence the data is coherent.
          set +e
          pg_restore -h localhost -U postgres -d drill --no-owner --no-privileges \
            --section=pre-data --section=data restore.dump 2> restore-data.log
          RC1=$?
          set -e
          IG1=$(grep -oE "errors ignored on restore: [0-9]+" restore-data.log | grep -oE "[0-9]+" || echo 0)
          echo "pass 1 (structure + rows): exit=$RC1, ignored=$IG1"
          tail -20 restore-data.log || true
          if [ "$IG1" -gt 5 ]; then echo "::error::too many errors restoring the DATA ($IG1)"; exit 1; fi

          psql -h localhost -U postgres -d drill -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN
              SELECT c.table_name, c.column_name
                FROM information_schema.columns c
                JOIN information_schema.tables t
                  ON t.table_schema = c.table_schema AND t.table_name = c.table_name
                 AND t.table_type = 'BASE TABLE'
               WHERE c.table_schema = 'public' AND c.data_type = 'uuid'
                 AND (c.column_name IN ('user_id','owner_id')
                      OR (c.table_name = 'profiles' AND c.column_name = 'id'))
            LOOP
              EXECUTE format('INSERT INTO auth.users(id) SELECT DISTINCT %I FROM public.%I '
                             'WHERE %I IS NOT NULL ON CONFLICT DO NOTHING',
                             r.column_name, r.table_name, r.column_name);
            END LOOP;
          END $$;
          SELECT 'accounts referenced by the restored data: ' || count(*) FROM auth.users;
          SQL

          set +e
          pg_restore -h localhost -U postgres -d drill --no-owner --no-privileges \
            --section=post-data restore.dump 2> restore-post.log
          RC2=$?
          set -e
          IG2=$(grep -oE "errors ignored on restore: [0-9]+" restore-post.log | grep -oE "[0-9]+" || echo 0)
          echo "pass 2 (constraints + indexes): exit=$RC2, ignored=$IG2"
          tail -30 restore-post.log || true
          if [ "$IG2" -gt 5 ]; then echo "::error::too many errors creating constraints ($IG2)"; exit 1; fi

      - name: Assert the restored data is real
        if: steps.gate.outputs.r2 == 'yes'
        run: |
          export PGPASSWORD=drill
          q() { psql -h localhost -U postgres -d drill -tAc "$1"; }
          TABLES=$(q "select count(*) from information_schema.tables where table_schema='public'")
          PROJECTS=$(q "select count(*) from projects" || echo 0)
          LAYERS=$(q "select count(*) from layers" || echo 0)
          FEATURES=$(q "select count(*) from features" || echo 0)
          GEOM_OK=$(q "select count(*) from (select geom from features where geom is not null limit 5) s" || echo 0)
          # a foreign key that was CREATED is a foreign key the data satisfies — cheap, real proof
          # that what came back is coherent and not just row-shaped
          FKS=$(q "select count(*) from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public' and c.contype='f'" || echo 0)
          ACCOUNTS=$(q "select count(*) from auth.users" || echo 0)
          echo "tables=$TABLES projects=$PROJECTS layers=$LAYERS features=$FEATURES geomSample=$GEOM_OK fks=$FKS"
          {
            echo "## Restore drill — restored + verified"
            echo "- public tables: **$TABLES** · foreign keys created and satisfied: **$FKS**"
            echo "- projects: **$PROJECTS** · layers: **$LAYERS** · features: **$FEATURES**"
            echo "- accounts referenced by the data: **$ACCOUNTS** (seeded — the dump is public-schema-only,"
            echo "  so \`auth.users\` itself is NOT in this backup; Supabase's own daily backups cover accounts)"
          } >> "$GITHUB_STEP_SUMMARY"
          # floors, not exact counts — the point is "the backup contains the real database"
          [ "$TABLES"   -ge 15 ]     || { echo "::error::too few tables restored"; exit 1; }
          [ "$PROJECTS" -ge 10 ]     || { echo "::error::projects table implausibly small"; exit 1; }
          [ "$FEATURES" -ge 100000 ] || { echo "::error::features table implausibly small"; exit 1; }
          [ "$GEOM_OK"  -ge 1 ]      || { echo "::error::no readable geometries"; exit 1; }
          [ "$FKS"      -ge 10 ]     || { echo "::error::constraints did not restore — the data may not be coherent"; exit 1; }

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 RESTORE DRILL FAILED — $(date -u +%Y-%m-%d)" \
            --body "The monthly backup restore drill failed. A backup that cannot restore is NOT a backup — treat as urgent. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
