# R2 sweep (10/7) — the bucket's garbage collection, in the process rather than by hand.
#
# Postgres cannot reach into R2, so deleting a layer "forever" leaves its tiles/parquet/geojson behind
# and records them in ms_deleted_artifacts. This job finishes that: it deletes what the ledger
# claims (and stamps the rows), deletes layer-keyed objects that belong to NO live layer and NO
# ledger row (the audit orphans), and marks never-baked rows swept. Owner 10/7: "is this something
# that should be done in the process anyway, and not manually?" — yes, this is that.
#
# Safety: only the artifact prefixes (tiles/, sidecars/, geoparquet/) are ever classified;
# maps/*, archives/* and every other bucket are untouched. One run deletes at most 2 GB (the
# script aborts over that — a classification bug cannot empty the bucket). Every delete is
# re-listed and verified.
#
# rm_prefix (dispatch only): an explicit folder-style prefix to remove in full, named by a human —
# e.g. archives/railways-2026-09-03-handbuilt-prepush/ — listed, capped, deleted, verified.
name: r2-sweep

on:
  schedule:
    - cron: "40 9 * * 0"      # Sundays 09:40 UTC
  workflow_dispatch:
    inputs:
      rm_prefix:
        description: "Also remove EVERYTHING under this exact prefix (must end with /). Leave empty normally."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sweep the tiles bucket (ledger + orphans + stamps), then any named prefix
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SWEEP_ACCESS_KEY_ID: ${{ secrets.R2_TILES_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          SWEEP_SECRET_ACCESS_KEY: ${{ secrets.R2_TILES_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          SWEEP_BUCKET: mapstructor-tiles
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SWEEP_RM_PREFIX: ${{ github.event.inputs.rm_prefix }}
        run: |
          node scripts/r2-sweep.mjs --orphans-out orphans.txt --apply-orphans orphans.txt --apply-ledger --stamp
      - name: Keep the manifest with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-sweep-manifest
          path: orphans.txt
          if-no-files-found: ignore
