# MapStructor Worker — the single Cloudflare Worker from the architecture doc.
# Roles (grows over time): R2 gated reads + uploads now; AI chatbot key + usage
# proxy + tile-job dispatch later. Deploy: `wrangler deploy` from this folder
# (needs `wrangler login` once, and the bucket created in the dashboard first).

name = "mapstructor-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"

# R2 bucket binding. Create the bucket in the Cloudflare dashboard (suggested
# name below), then this binding gives the Worker direct access — no keys in code.
[[r2_buckets]]
binding = "TILES"
bucket_name = "mapstructor-tiles"

# The PRIVATE bucket (no public custom domain — the tiles bucket is world-readable at
# tiles.mapstructor.com, so anything sensitive must live here instead). Holds the nightly
# DB dumps AND the business tools' data (invoices/…), all of which the nightly workflow
# mirrors wholesale to Backblaze — private storage and off-provider backup in one move.
[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "mapstructor-db-backups"

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   SUPABASE_URL          — https://eqpxlwbjqiwfjlsuapvu.supabase.co
#   SUPABASE_ANON_KEY     — the publishable key (used to validate user tokens)
# Later: ANTHROPIC_API_KEY, GITHUB_DISPATCH_TOKEN.

# ROUTES ARE MANAGED IN THE CLOUDFLARE DASHBOARD — deliberately not here.
#
# This block used to sit after [[r2_buckets]], where TOML read it as a field of that
# table; wrangler warned ("Unexpected fields found in r2_buckets[0]: routes") and the
# routes were never applied from this file (7/30). The live routes have been in the
# dashboard all along, which is why /maps/* and /ames/* work.
#
# It stays out on purpose: `mapstructor.com/ames/*` proxies the museum encyclopedia on
# the old box — a live dependency of the Ames History Museum's own website. A deploy
# that rewrote the route set could take that offline, and a deploy should never be able
# to do that. Change routes in the dashboard, where the change is visible and reversible.
#
# Current routes (verified 7/30): mapstructor.com/* · mapstructor.com/maps/* · /ames/*
# (zone e0770d1677077e48d164538f4f938394). The domain swap narrows the first one — see
# process/domain-swap-runbook.md.
